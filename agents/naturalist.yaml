# FloraLens naturalist supervisor (PRD P5-6 §9, D2 four-role team) — compiled by
# the shared AgentForge Unified Agent Core (agent_core.compile_agent). It routes
# each request to one of three sub-agents (agents-as-tools): `identifier`
# (species ID from features, exposed as `ask_identifier`), `researcher`
# (cited botanical facts, `ask_researcher`), and `care_advisor` (FloraLens
# gallery facts, `ask_care_advisor`). It keeps `web_search` as a direct fallback
# for simple general questions.
id: naturalist
version: 1
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
prompt_ref: prompts/naturalist.md
tools:
  - web_search
# Phase 7 (PRD §9 example, Epic E2/E4): long-term memory so the assistant
# recalls prior turns ("what the user said, what it answered") across
# threads, and so /api/garden's "My Garden" memory inspector has a real
# store to list/clear — apps/api/app/memory_service.py reads this exact
# provider/scope/namespace, never a second disconnected store. `in_memory`
# is the default backend (process-local, no external deps); swap to `mem0`
# here for semantic, persistent memory — no core or app code change needed.
memory:
  provider: in_memory
  scope: user
  namespace: floralens
sub_agents:
  - identifier
  - researcher
  - care_advisor
# Runtime-enforced output guardrails (agent_core built-ins, run in listed order
# over the supervisor's FINAL answer — not prompt text). `no_medical_dosage`
# refuses answers stating a specific drug dose; `educational_disclaimer` appends
# a short "informational, not professional advice" note when missing; and
# `no_secret_exfil` redacts any leaked API key / token / private key.
guardrails:
  - no_medical_dosage
  - educational_disclaimer
  - no_secret_exfil
limits:
  max_steps: 6
  wall_clock_s: 60
