name: CI

# Build-blocking gates for the FloraLens ML backend + web UI (PRD §14).
# Two independent jobs: Python tests (leakage/isolation/calibration/preprocess/
# device/API unit tests) and the Next.js web build.
on:
  push:
  pull_request:

# Least-privilege default: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # `pip install -r requirements.txt` as a single resolver pass is
          # impossible: datasets==5.0.0 requires pyarrow>=21, mlflow==2.19.0
          # requires pyarrow<19 (verified locally -- pip's resolver rejects
          # the combined install outright with ResolutionImpossible). Neither
          # tests/ nor apps/api/ import `datasets` or `mlflow` at collection
          # time (datasets is only imported lazily inside
          # ml/data/dataset.py's HF-ingestion function, used solely by
          # ml/scripts/build_splits.py; mlflow is only imported by
          # ml/scripts/*.py entry points) -- so installing everything else
          # first and mlflow last (letting pip downgrade pyarrow afterwards)
          # gives every package the test suite actually imports a working
          # install, matching what is already installed in this project's own
          # (gitignored) dev venv/. `import datasets` itself would then raise
          # (pyarrow 18.x lacks an attribute datasets 5.0.0 needs), but no
          # test exercises that import, so it does not affect this gate.
          pip install fastapi==0.115.6 "uvicorn[standard]==0.34.0" pydantic==2.10.5 \
            python-multipart==0.0.20 pytest==8.3.4 numpy==1.26.4 pillow==11.1.0 \
            scikit-learn==1.6.1 imagehash==4.3.1 requests==2.32.3 datasets==5.0.0 \
            opencv-python-headless==4.10.0.84 transformers==5.13.0 PyJWT==2.13.0
          pip install mlflow==2.19.0
          # torch/torchvision/open-clip-torch are installed separately (see
          # README "Setup"), not pinned in requirements.txt, because the dev
          # environment chooses a CUDA or CPU wheel depending on local GPU
          # availability. ubuntu-latest runners have no GPU, so use the CPU
          # wheel index directly (same versions the README documents as the
          # CPU fallback) -- this is what ml/embeddings/backbone.py and
          # ml/train/* import at collection time.
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install open-clip-torch==2.31.0
          # The naturalist assistant reuses AgentForge's Unified Agent Core.
          # Locally it's an editable install from the sibling ../agentforge repo
          # (not checked out here), so in CI install it from the public
          # agentforge repo instead + the extra checkpointer/observability deps
          # FloraLens pins. Without it every test that imports the app fails to
          # collect (ModuleNotFoundError: agent_core).
          pip install "agent-core[openai] @ git+https://github.com/pdz1804/agentforge.git@main#subdirectory=packages/agent-core" \
            aiosqlite==0.22.1 langgraph-checkpoint-sqlite==3.1.0 asyncpg==0.31.0
          pip install pytest-cov

      # No pyproject.toml/ruff.toml/setup.cfg configures ruff in this repo
      # (verified: no ruff section anywhere, ruff not in requirements.txt).
      # Per spec, the lint gate is conditional on ruff being configured here;
      # it is not, so this step is intentionally a no-op rather than
      # introducing a brand-new lint gate (and its findings) outside this
      # change's scope. Uncomment once ruff config is added to the repo:
      # - name: Lint (ruff)
      #   run: |
      #     pip install ruff
      #     ruff check .

      - name: Run pytest (leakage / isolation / calibration / preprocess / device / API unit tests)
        run: |
          # ml/data/manifests/*.json and ml/eval/reports/*.json ARE committed
          # (see .gitignore's `!ml/data/manifests/` / `!ml/eval/reports/`), so
          # the leakage hard-asserts (tests/test_leakage.py) and the test-set
          # isolation guard (tests/test_test_isolation.py) run for real here,
          # not skipped.
          #
          # ml/data/embeddings_cache/ and ml/data/raw/ ARE gitignored (large,
          # reproducible artifacts) and are absent in this checkout, so:
          #   - apps/api/tests/test_api.py's search-endpoint tests self-skip
          #     via `@pytest.mark.skipif(not EMBEDDINGS_CACHE.exists(), ...)`.
          #   - tests/test_smoke_e2e.py::test_embed_index_query_smoke only
          #     guards on the (committed) split manifest, not on the (ignored)
          #     raw source images it actually opens, so it would fail on a
          #     fresh checkout for a reason unrelated to the code under test
          #     (missing dataset files, not a regression). It is deselected
          #     here rather than left to fail on a missing-fixture path.
          pytest -v --deselect tests/test_smoke_e2e.py::test_embed_index_query_smoke \
            --cov=apps/api/app --cov-report=term-missing

      - name: Run ML metric-regression gate (Recall@5 / mAP@10 must not regress)
        run: |
          # Build-blocking retrieval-quality guard (Gap G9): fails if the
          # shipped model's Recall@5 / mAP@10 on the FIXED test subset drops
          # below the recorded baseline minus tolerance (ml/eval/
          # metric_regression_baseline.json). It reads only committed JSON eval
          # reports -- no model download, no embeddings cache (gitignored),
          # CPU-only. The test lives under ml/eval/ rather than the tests/
          # testpaths in pytest.ini, so its path is passed explicitly here.
          pytest -v ml/eval/test_metric_regression.py

      - name: Dependency CVE scan (pip-audit, advisory)
        # Advisory: audits the already-installed environment for known CVEs.
        # continue-on-error so an upstream advisory in a heavy transitive pin
        # (torch / transformers / mlflow stack) does not block unrelated
        # changes; findings are always printed for triage.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc || echo "::warning title=pip-audit::advisory findings above; review before shipping"

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js production build must succeed)
        run: npm run build

      - name: npm audit (advisory)
        # Advisory web-dependency vulnerability scan against the committed
        # lockfile; continue-on-error so upstream advisories do not block a
        # build, but they are surfaced in the log for triage.
        continue-on-error: true
        run: npm audit --audit-level=high || echo "::warning title=npm-audit::advisory findings above; review before shipping"

  web-e2e:
    name: web-e2e
    # HONEST gate. Unlike AgentForge (which runs fully offline via the echo
    # provider), FloraLens's runtime UI flows depend on artifacts that are
    # gitignored and secrets that are unset on CI runners, so they CANNOT run
    # here and are NOT silently marked green as if they had:
    #   - ml/data/embeddings_cache/  -> POST /api/search, GET /api/galaxy   [gitignored]
    #   - ml/data/raw/flowers102_hf/ -> search query image + specimen/garden thumbnails [gitignored]
    #   - OPENAI_API_KEY             -> POST /api/assistant naturalist agent [secret, unset]
    # Merely importing the API pulls the heavy ML backbone stack too, so even a
    # /health smoke would need that full environment. This job therefore detects
    # the artifacts+key; when absent (the CI reality) it prints an explicit SKIP
    # notice and runs nothing further. On a runner that HAS the embeddings cache
    # + OPENAI_API_KEY (e.g. a provisioned self-hosted box) the same job builds
    # the web app, starts the API + web, runs the Playwright suite, and fires a
    # /health p95 load smoke. The always-on offline gate is the `web-build` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect model artifacts + assistant key (gitignored/secret -- absent in CI)
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f ml/data/embeddings_cache/metadata.json ] && [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SKIPPED -- model-dependent e2e cannot run in CI (explicit, not a silent pass)
        if: steps.gate.outputs.present != 'true'
        run: |
          echo "::warning title=FloraLens web-e2e skipped::runtime Playwright e2e needs gitignored artifacts / secret keys absent on CI runners"
          echo "SKIPPED: FloraLens runtime Playwright e2e did NOT run in CI."
          echo "It requires artifacts/keys that are gitignored or secret and absent here:"
          echo "  - ml/data/embeddings_cache/  (POST /api/search, GET /api/galaxy)          [gitignored]"
          echo "  - ml/data/raw/flowers102_hf/ (search query image, specimen + garden thumbs) [gitignored]"
          echo "  - OPENAI_API_KEY             (POST /api/assistant naturalist agent)        [secret, unset]"
          echo "Specs not run: flower-search, galaxy-verify, garden-capture, assistant-capture,"
          echo "  and theme-tabs-about (its Pipeline tab reads the live /api/pipeline endpoint)."
          echo "The offline gate that DOES run in CI is the 'web-build' job (Next.js production build)."

      # --- The steps below run ONLY on a runner with the cache + key present. ---
      # They never execute in CI (present=false), so they cannot make CI flaky;
      # they exist so the gate is real wherever the full environment is provided.
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.11"

      - name: Install Python deps + editable agent-core (full ML environment)
        if: steps.gate.outputs.present == 'true'
        run: |
          # Mirror the proven install ordering from the python-tests job (the
          # datasets/mlflow pyarrow conflict forces mlflow last), then add the
          # sibling editable agent-core the assistant service imports.
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 "uvicorn[standard]==0.34.0" pydantic==2.10.5 \
            python-multipart==0.0.20 numpy==1.26.4 pillow==11.1.0 \
            scikit-learn==1.6.1 imagehash==4.3.1 requests==2.32.3 datasets==5.0.0 \
            opencv-python-headless==4.10.0.84 transformers==5.13.0 PyJWT==2.13.0
          pip install mlflow==2.19.0
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install open-clip-torch==2.31.0
          # The naturalist assistant reuses AgentForge's Unified Agent Core.
          # Locally it's an editable install from the sibling ../agentforge repo
          # (not checked out here), so in CI install it from the public
          # agentforge repo instead + the extra checkpointer/observability deps
          # FloraLens pins. Without it every test that imports the app fails to
          # collect (ModuleNotFoundError: agent_core).
          pip install "agent-core[openai] @ git+https://github.com/pdz1804/agentforge.git@main#subdirectory=packages/agent-core" \
            aiosqlite==0.22.1 langgraph-checkpoint-sqlite==3.1.0 asyncpg==0.31.0
          if [ -d ../agentforge/packages/agent-core ]; then
            pip install -e "../agentforge/packages/agent-core[openai]"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser (chromium only)
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start API and wait for /health
        if: steps.gate.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          nohup uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8100 > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8100/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 120s"; cat api.log; exit 1

      - name: Build web (Next.js production build)
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build

      - name: Start web (production) and wait for it to answer
        if: steps.gate.outputs.present == 'true'
        run: |
          cd apps/web && nohup npm run start > web.log 2>&1 &
          echo started
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3100 > /dev/null 2>&1; then
              echo "web up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web did not start within 60s"; cat apps/web/web.log; exit 1

      - name: Playwright e2e (full retrieval + assistant flows)
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright test

      - name: Load / p95 smoke -- concurrent /health (no artifacts needed)
        if: steps.gate.outputs.present == 'true'
        run: |
          node apps/web/e2e/load-smoke.mjs \
            --url http://127.0.0.1:8100/health \
            --count 60 --concurrency 10 --p95 1500

      - name: Upload Playwright evidence
        if: always() && steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: floralens-web-e2e-evidence
          path: plans/260709-1427-dual-app-buildout/reports/floralens-ui
          if-no-files-found: ignore
