name: CI

# Build-blocking gates for the FloraLens ML backend + web UI (PRD §14).
# Two independent jobs: Python tests (leakage/isolation/calibration/preprocess/
# device/API unit tests) and the Next.js web build.
on:
  push:
  pull_request:

jobs:
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # `pip install -r requirements.txt` as a single resolver pass is
          # impossible: datasets==5.0.0 requires pyarrow>=21, mlflow==2.19.0
          # requires pyarrow<19 (verified locally -- pip's resolver rejects
          # the combined install outright with ResolutionImpossible). Neither
          # tests/ nor apps/api/ import `datasets` or `mlflow` at collection
          # time (datasets is only imported lazily inside
          # ml/data/dataset.py's HF-ingestion function, used solely by
          # ml/scripts/build_splits.py; mlflow is only imported by
          # ml/scripts/*.py entry points) -- so installing everything else
          # first and mlflow last (letting pip downgrade pyarrow afterwards)
          # gives every package the test suite actually imports a working
          # install, matching what is already installed in this project's own
          # (gitignored) dev venv/. `import datasets` itself would then raise
          # (pyarrow 18.x lacks an attribute datasets 5.0.0 needs), but no
          # test exercises that import, so it does not affect this gate.
          pip install fastapi==0.115.6 "uvicorn[standard]==0.34.0" pydantic==2.10.5 \
            python-multipart==0.0.20 pytest==8.3.4 numpy==1.26.4 pillow==11.1.0 \
            scikit-learn==1.6.1 imagehash==4.3.1 requests==2.32.3 datasets==5.0.0 \
            opencv-python-headless==4.10.0.84 transformers==5.13.0
          pip install mlflow==2.19.0
          # torch/torchvision/open-clip-torch are installed separately (see
          # README "Setup"), not pinned in requirements.txt, because the dev
          # environment chooses a CUDA or CPU wheel depending on local GPU
          # availability. ubuntu-latest runners have no GPU, so use the CPU
          # wheel index directly (same versions the README documents as the
          # CPU fallback) -- this is what ml/embeddings/backbone.py and
          # ml/train/* import at collection time.
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install open-clip-torch==2.31.0

      # No pyproject.toml/ruff.toml/setup.cfg configures ruff in this repo
      # (verified: no ruff section anywhere, ruff not in requirements.txt).
      # Per spec, the lint gate is conditional on ruff being configured here;
      # it is not, so this step is intentionally a no-op rather than
      # introducing a brand-new lint gate (and its findings) outside this
      # change's scope. Uncomment once ruff config is added to the repo:
      # - name: Lint (ruff)
      #   run: |
      #     pip install ruff
      #     ruff check .

      - name: Run pytest (leakage / isolation / calibration / preprocess / device / API unit tests)
        run: |
          # ml/data/manifests/*.json and ml/eval/reports/*.json ARE committed
          # (see .gitignore's `!ml/data/manifests/` / `!ml/eval/reports/`), so
          # the leakage hard-asserts (tests/test_leakage.py) and the test-set
          # isolation guard (tests/test_test_isolation.py) run for real here,
          # not skipped.
          #
          # ml/data/embeddings_cache/ and ml/data/raw/ ARE gitignored (large,
          # reproducible artifacts) and are absent in this checkout, so:
          #   - apps/api/tests/test_api.py's search-endpoint tests self-skip
          #     via `@pytest.mark.skipif(not EMBEDDINGS_CACHE.exists(), ...)`.
          #   - tests/test_smoke_e2e.py::test_embed_index_query_smoke only
          #     guards on the (committed) split manifest, not on the (ignored)
          #     raw source images it actually opens, so it would fail on a
          #     fresh checkout for a reason unrelated to the code under test
          #     (missing dataset files, not a regression). It is deselected
          #     here rather than left to fail on a missing-fixture path.
          pytest -v --deselect tests/test_smoke_e2e.py::test_embed_index_query_smoke

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js production build must succeed)
        run: npm run build
